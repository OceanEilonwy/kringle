[package]
name = "kringle"
version = "0.3.0"
edition = "2024"
# Tern and Tuta's SDK are GPL-3.0, and they are linked into the binary.
license = "GPL-3.0-only"
description = "A tiny Kris Kringle / Secret Santa gift swap server, small enough for a home router."

[dependencies]
form_urlencoded = "1"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
maud = "0.27"
qrcodegen = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "macros", "signal", "time", "sync"] }
# Tuta has no SMTP: Tern (an email client for Tuta) signs in and sends with
# Tuta's own SDK. Pinned, as its API follows Tern's composer.
tern-core = { git = "https://github.com/OceanEilonwy/tern", rev = "a97d5fb" }
tern-tuta = { git = "https://github.com/OceanEilonwy/tern", rev = "a97d5fb" }

# build.rs gzips the CSS, JS and SVGs; it runs on the build machine only.
[workspace]
members = ["."]

[build-dependencies]
flate2 = "1"

[dev-dependencies]
flate2 = "1"
tokio = { version = "1", features = ["test-util"] }

# Small over fast: family-scale traffic never notices. A panic aborts; on the
# router procd restarts the service. scripts/build-openwrt.sh goes further on
# nightly (std rebuilt with panic = immediate-abort).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
