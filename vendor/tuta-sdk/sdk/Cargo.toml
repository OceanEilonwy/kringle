[package]
name = "tuta-sdk"
version = "365.261030.0"
edition = "2021"
rust-version = "1.84.0"

[lib]
name = "tutasdk"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
crypto-primitives = { path = "../crypto-primitives", default-features = false }
util = { path = "../util", default-features = false }
async-trait = "0.1.77"
thiserror = "2.0"
futures = "0.3.31"
serde_bytes = "0.11.15"
num_enum = "0.7.3"
minicbor = { version = "0.25", features = ["std", "alloc"] }
const-hex = { version = "1.12.0", features = ["serde"] }
lz4_flex = { version = "0.13.0", default-features = false, features = [
    "safe-encode",
    "safe-decode",
    "std",
] }
time = { version = "0.3.37", features = ["serde", "macros", "local-offset"] }
time-tz = { version = "2.0.0", features = ["db", "posix-tz"] }

sha2 = "0.10.8"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
hkdf = "0.12.4"
argon2 = { version = "0.5.3", features = ["zeroize"] }
pqcrypto-mlkem = { version = "0.1.0", default-features = false, features = [
    "std",
] }
pqcrypto-traits = "0.3.5"
rsa = "0.9.6"
sha3 = "0.10.8"
rand_core = { version = "0.6.4", features = ["getrandom"] }

log = "0.4.22"
base64 = "0.22.1"
tokio = { version = "1.43", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
serde = { version = "1.0.210", features = ["derive", "rc"] }
serde_json = "1.0.117"
uniffi = { git = "https://github.com/mozilla/uniffi-rs.git", rev = "13a1c559cb3708eeca40dcf95dc8b3ccccf3b88c", default-features = false }

# only used for the native rest client
hyper = { version = "1.5", features = ["client"], optional = true }
hyper-util = { version = "0.1.10", features = ["full"], optional = true }
http-body-util = { version = "0.1.2", optional = true }
# Kringle: ring only (no aws-lc/cmake) and the bundled Mozilla roots, since
# OpenWrt routers often have no CA bundle installed.
hyper-rustls = { version = "0.27.7", default-features = false, features = [
    "ring",
    "http1",
    "http2",
    "tls12",
    "native-tokio",
    "webpki-roots",
], optional = true }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"], optional = true }
form_urlencoded = "1"

# allow initializing a simple_logger if the consuming application (or examples) want to do that.
simple_logger = { version = "5.0.0", optional = true }
regex = "1.11.1"
x25519-dalek = { version = "2.0.1", features = ["default", "static_secrets"] }
curve25519-dalek = "4.1.3"

[target.'cfg(target_os = "android")'.dependencies]
android_log = "0.1.3"
[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2.0"

[build-dependencies]
uniffi = { git = "https://github.com/mozilla/uniffi-rs.git", rev = "13a1c559cb3708eeca40dcf95dc8b3ccccf3b88c", default-features = false, features = ["build"] }

[features]
net = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:hyper-rustls",
    "dep:rustls",
]
# turns on the simple_logger logger when the sdk is initialized.
logging = ["dep:simple_logger"]
testing = ["logging"]
test-with-local-http-server = []
